fairness_matrix:
  cognodb:
    name: "CognoDB Cloud"
    deployment_type: "cloud_managed"
    resource_source: "cloud_provider_tier"
    image_or_build: "managed_cloud"
    default_port: 7687
    cpu: "not observable"
    ram: "not observable"
    storage: "not observable"
    version: "not observable"
    region: "cloud"
    notes: "Free-tier managed cloud instance accessed via Bolt+s protocol"

  neo4j:
    name: "Neo4j"
    deployment_type: "docker_local"
    resource_source: "docker_container"
    image_or_build: "neo4j:5.26.0-community"
    default_port: 7687
    cpu: "not yet configured"
    ram: "not yet configured"
    storage: "not yet configured"
    version: "5.26.0 (community)"
    region: "local"
    notes: "Official Neo4j Community container running on Bolt/Cypher"

  memgraph:
    name: "Memgraph"
    deployment_type: "docker_local"
    resource_source: "docker_container"
    image_or_build: "memgraph/memgraph:2.21.1"
    default_port: 7688
    cpu: "not yet configured"
    ram: "not yet configured"
    storage: "not yet configured"
    version: "2.21.1"
    region: "local"
    notes: "In-memory C++ graph engine container exposed on port 7688 (mapped from 7687)"

  falkordb:
    name: "FalkorDB"
    deployment_type: "docker_local"
    resource_source: "docker_container"
    image_or_build: "falkordb/falkordb:v1.4.0"
    default_port: 6379
    cpu: "not yet configured"
    ram: "not yet configured"
    storage: "not yet configured"
    version: "v1.4.0"
    region: "local"
    notes: "Redis-based low-latency graph module with openCypher support"

  arangodb:
    name: "ArangoDB"
    deployment_type: "docker_local"
    resource_source: "docker_container"
    image_or_build: "arangodb:3.12.3"
    default_port: 8529
    cpu: "not yet configured"
    ram: "not yet configured"
    storage: "not yet configured"
    version: "3.12.3"
    region: "local"
    notes: "Multi-model database with vertex and edge collections queried via AQL"
