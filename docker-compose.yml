services:
  neo4j:
    image: neo4j:5.26.0-community
    container_name: benchmark-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-local_dev_password}
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $${NEO4J_PASSWORD:-local_dev_password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  memgraph:
    image: memgraph/memgraph:2.21.0
    container_name: benchmark-memgraph
    ports:
      - "7688:7687"
    volumes:
      - memgraph_data:/var/lib/memgraph
    restart: unless-stopped

  falkordb:
    image: falkordb/falkordb:v4.20.2
    container_name: benchmark-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    restart: unless-stopped

  arangodb:
    image: arangodb:3.12.3
    container_name: benchmark-arangodb
    ports:
      - "8529:8529"
    environment:
      - ARANGO_ROOT_PASSWORD=${ARANGODB_PASSWORD:-local_dev_password}
    volumes:
      - arangodb_data:/var/lib/arangodb3
    restart: unless-stopped

volumes:
  neo4j_data:
  memgraph_data:
  falkordb_data:
  arangodb_data:
